name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に1つのデプロイのみ実行（進行中はキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- 顧客側アプリ (mos_front) ---
      - name: Build customer app
        working-directory: mos_front
        run: |
          npm install
          npm run build

      # --- スタッフ側アプリ (mos_employee) ---
      - name: Build staff app
        working-directory: mos_employee
        run: |
          npm install
          npm run build

      # --- 公開ディレクトリを組み立て ---
      #   _site/           ランディングページ
      #   _site/customer/  顧客側アプリ
      #   _site/staff/     スタッフ側アプリ
      - name: Assemble site
        run: |
          mkdir -p _site
          cp landing/index.html _site/index.html
          cp -r mos_front/dist _site/customer
          cp -r mos_employee/dist _site/staff

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
